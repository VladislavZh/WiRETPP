model:
  backbone: cotic
  input_channels: 32
  hidden_size: 64
  layers: 7
  attention_heads: 4
  use_layer_norm: true
  kernel_size: 3
  dropout: 0.1
  dilation_factor: 1.29
  integral_method: monte_carlo
  integral_samples: 50
  integral_seed: 0
  component_noise: 0.02
  wishart_intensity_floor: 0.000001
  wishart_intensity_floor_scaling: constant

training:
  method: wishart
  shared_pretrain_steps: 10
  pure_steps: 600
  active_cycles: 75
  neural_steps_per_cycle: 8
  local_steps: 10
  local_samples: 4
  local_evaluation_samples: 8
  population_df: 16.0
  learn_population_df: false
  initial_alpha: 0.1
  alpha_steps: 25
  alpha_samples: 4
  omega_damping: 0.25
  alpha_damping: 0.5
  mixture_weight_damping: 0.25
  balanced_cycles: 10
  validation_samples: 64
  test_samples: 256
  test_monte_carlo_repeats: 3
  test_local_steps: 800
  test_local_samples: 2
  test_local_evaluation_samples: 64
  test_local_adaptive: true
  effective_batch_size: 256
  batch_size: 64
  evaluation_batch_size: 32
  evaluation_sample_shard_size: 64
  path_shard_size: 256
  em_batch_size: 4096
  learning_rate: 0.001
  weight_decay: 0.00001
  gradient_clip: 500.0
  fixed_alpha: null

runtime:
  data_root: data
  output_root: runs/dan12_common_p99_75cycle_seed0
  dataset: all12
  accelerator: cuda
  precision: 32-true
  split_seed: 42
  optimization_seed: 0
  monte_carlo_seed: 0
  deterministic: true
  mixture_components: 5
  packed_filename: events.parquet
