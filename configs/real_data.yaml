model:
  backbone: cotic
  input_channels: 192
  hidden_size: 512
  layers: 8
  attention_heads: 8
  use_layer_norm: true
  kernel_size: 3
  dropout: 0.1
  dilation_factor: 1.29
  integral_method: monte_carlo
  integral_samples: 50
  integral_seed: 0
  component_noise: 0.02
  wishart_intensity_floor: 0.000001
  wishart_intensity_floor_scaling: constant

training:
  method: wishart
  shared_pretrain_steps: 10
  pure_steps: 400
  active_cycles: 50
  neural_steps_per_cycle: 8
  local_steps: 5
  local_samples: 2
  local_evaluation_samples: 4
  population_df: 16.0
  learn_population_df: false
  initial_alpha: 0.1
  fixed_alpha: null
  alpha_steps: 25
  alpha_samples: 4
  omega_damping: 0.25
  alpha_damping: 0.5
  mixture_weight_damping: 0.25
  mixture_weight_dirichlet_concentration: 1.0
  balanced_cycles: 2
  validation_samples: 64
  test_samples: 64
  test_monte_carlo_repeats: 3
  batch_size: 32
  evaluation_batch_size: 8
  evaluation_sample_shard_size: 64
  path_shard_size: 64
  em_batch_size: 4000
  effective_batch_size: 140
  learning_rate: 0.0003
  weight_decay: 0.00001
  gradient_clip: 1.0
  reduce_lr_on_plateau: true
  lr_plateau_factor: 0.5
  lr_plateau_patience: 3
  lr_plateau_min_lr: 0.00001

runtime:
  data_root: data
  output_root: runs/real_data_50cycle
  dataset: retweet
  accelerator: cuda
  precision: 32-true
  split_seed: 42
  optimization_seed: 0
  monte_carlo_seed: 0
  neural_seed: 2026082800
  deterministic: true
  mixture_components: 5
  real_split_protocol: deduplicated_validation_half
