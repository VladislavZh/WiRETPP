[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "active-wishart-tpp"
version = "0.1.0"
description = "Readable COTIC mixtures with active-block Wishart random effects"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "easy-tpp==0.2.1",
  "lightning==2.6.1",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pyarrow>=15",
  "PyYAML>=6,<7",
  "torch>=2.6,<3",
]

[project.scripts]
wishart-tpp = "wishart_tpp.cli:main"

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"
